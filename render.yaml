# Niyam on Render (free tier): one Docker web service + free Postgres. No disk.
# Sleeps when idle — open the URL to wake it, then re-run seed_demo.py if PDFs 404.
# Free Postgres expires after 30 days. Dashboard: New > Blueprint > this repo.

services:
  - type: web
    name: niyam
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NIYAM_ENV
        value: prod
      - key: NIYAM_API_KEY
        sync: false
      - key: NIYAM_DATABASE_URL
        fromDatabase:
          name: niyam-db
          property: connectionString
      - key: NIYAM_DATA_ROOT
        value: /data
      - key: NIYAM_BLOB_DIR
        value: /data/var/blobs
      - key: NIYAM_CONSOLE_DIR
        value: /app/console
      - key: NIYAM_INGEST_ON_START
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: NIYAM_STORE_CHECK_TEXT
        value: "true"
      - key: SARVAM_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: NIYAM_LLM_PROVIDER
        value: auto
      - key: NIYAM_OLLAMA_MODEL
        value: gpt-oss:120b

databases:
  - name: niyam-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: niyam
    user: niyam
