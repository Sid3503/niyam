# Niyam web console: static SPA + reverse proxy to the API container.
# Placed at /etc/nginx/conf.d/default.conf by the Dockerfile.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker's embedded DNS. Resolving `api` lazily means the web container
    # still starts if the API container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # ── security headers (server level; locations below avoid add_header so these are inherited) ──
    # style-src needs 'unsafe-inline': the sidebar injects a <style> tag and framer-motion sets inline styles.
    # No script 'unsafe-inline' and no 'unsafe-eval'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ── compression ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    client_max_body_size 1m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── API + liveness/readiness proxied to the api service ──
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /healthz { proxy_pass $api_upstream; }
    location = /readyz  { proxy_pass $api_upstream; }

    # ── hashed build assets: cache for a year (file names change on every build) ──
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ── everything else: SPA fallback; index.html is never cached ──
    location = /index.html {
        expires epoch;
    }
    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}
